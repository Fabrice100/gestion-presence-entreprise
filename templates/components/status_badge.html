{# Badge de statut réutilisable #}
{# Usage: {% include 'components/status_badge.html' with status='approved' text='Approuvé' %} #}

<span class="px-3 py-1 text-xs font-semibold rounded-full
    {% if status == 'approved' or status == 'approved_rh' %}bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400
    {% elif status == 'rejected' or status == 'rejected_rh' or status == 'rejected_manager' %}bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400
    {% elif status == 'pending' or status == 'approved_manager' %}bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400
    {% elif status == 'in_progress' %}bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400
    {% elif status == 'completed' %}bg-purple-100 text-purple-800 dark:bg-purple-900/30 dark:text-purple-400
    {% elif status == 'cancelled' %}bg-gray-100 text-gray-800 dark:bg-gray-900/30 dark:text-gray-400
    {% elif color %}bg-{{ color }}-100 text-{{ color }}-800 dark:bg-{{ color }}-900/30 dark:text-{{ color }}-400
    {% else %}bg-gray-100 text-gray-800 dark:bg-gray-900/30 dark:text-gray-400{% endif %}
    {{ class }}">
    {% if icon %}<i class="{{ icon }} mr-1"></i>{% endif %}
    {{ text|default:status }}
</span>
