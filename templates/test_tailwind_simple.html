<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Tailwind Simple</title>
    
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <h1 class="text-4xl font-bold text-gray-900 mb-6 text-center">
                    🎨 Test Tailwind CSS Simple
                </h1>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl p-6 text-white">
                        <h3 class="text-xl font-semibold mb-2">Carte 1</h3>
                        <p class="text-blue-100">Test des gradients et couleurs</p>
                    </div>
                    
                    <div class="bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl p-6 text-white">
                        <h3 class="text-xl font-semibold mb-2">Carte 2</h3>
                        <p class="text-green-100">Test des animations</p>
                    </div>
                    
                    <div class="bg-gradient-to-r from-purple-500 to-pink-600 rounded-xl p-6 text-white">
                        <h3 class="text-xl font-semibold mb-2">Carte 3</h3>
                        <p class="text-purple-100">Test des ombres</p>
                    </div>
                </div>
                
                <div class="text-center">
                    <button class="bg-gradient-to-r from-red-500 to-pink-600 text-white px-8 py-4 rounded-xl text-lg font-semibold hover:from-red-600 hover:to-pink-700 transition-all duration-300 shadow-lg hover:shadow-xl">
                        Bouton de Test
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
