{% extends 'base.html' %}
{% load static %}

{% block title %}Avertissement{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-warning">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">
                        <i class="fas fa-exclamation-triangle"></i> Avertissement
                    </h4>
                </div>
                <div class="card-body text-center py-5">
                    <i class="fas fa-info-circle fa-4x text-warning mb-4"></i>
                    <h3>Information</h3>
                    <p class="text-muted mb-4">
                        {{ message|default:"Une information importante vous concerne." }}
                    </p>
                    <div class="mt-4">
                        <a href="{% url 'dashboard:dashboard' %}" class="btn btn-primary">
                            <i class="fas fa-home"></i> Retour à l'accueil
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left"></i> Retour
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
