{% extends 'base.html' %}
{% load static %}

{% block title %}Réinitialiser le mot de passe{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title">Réinitialiser le mot de passe</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Envoyer le lien de réinitialisation</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
